version: "1"

global:
  restic-stale-lock-age: 2h


default:
  repository: "rest:http://localhost:8080/"
  password-file: "/Users/kei/backup/password"

  lock: "/tmp/resticprofile-profile-src.lock"
  force-inactive-lock: true

  backup:
    exclude-file: "excludes"
    exclude-caches: true
    source:
    - "/Users/kei"
    schedule: daily
    schedule-permission: system
    schedule-lock-wait: 10m
    schedule-after-network-online: true
    schedule-ignore-on-battery: true
    cache-dir: "/Users/kei/.cache/restic"

  retention:
    after-backup: true
    keep-daily: 3
    keep-weekly: 2
    keep-monthly: 1
    prune: true

  profile:
    status-file: /Users/kei/backup/status.json
